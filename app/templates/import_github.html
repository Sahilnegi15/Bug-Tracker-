{% extends "base.html" %}

{% block content %}

<h2>Import GitHub Issues</h2>

<form method="POST">

    <input
        type="text"
        name="owner"
        placeholder="Owner"
    >

    <br><br>

     <input
        type="url"
        name="repo_url"
        placeholder="https://github.com/pallets/flask"
        style="width: 500px;"
        required
    >

    <br><br>

    <button type="submit">
        Import Issues
    </button>

</form>

{% endblock %}
